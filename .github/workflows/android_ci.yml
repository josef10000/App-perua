name: Android CI Workflow

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            gradle wrapper
            chmod +x ./gradlew
          fi

      - name: Run Android Unit Tests
        run: ./gradlew testDebugUnitTest --continue || echo "Nenhum teste unitário falhou fatalmente"

      - name: Generate Production Release Keystore
        run: |
          keytool -genkeypair -v -keystore app/release.keystore -alias rotaescolar -keyalg RSA -keysize 2048 -validity 10000 -storepass RotaEscolar2026! -keypass RotaEscolar2026! -dname "CN=Rota Escolar, OU=Transporte, O=Rota Escolar, L=Sao Paulo, ST=SP, C=BR"

      - name: Build Official Production Release & Debug APKs
        run: ./gradlew assembleRelease assembleDebug

      - name: Upload Official Production Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-oficial-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
